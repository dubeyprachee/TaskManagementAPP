<div class="task-list-container">
  <h2>Tasks</h2>
  <div class="filters">
    <mat-form-field appearance="fill"><mat-label>Search</mat-label><input matInput [(ngModel)]="searchQuery" (ngModelChange)="applyFilters()"></mat-form-field>
    <mat-form-field appearance="fill">
      <mat-label>Status</mat-label>
      <mat-select [(ngModel)]="filterStatus" (selectionChange)="applyFilters()">
        <mat-option value="all">All</mat-option>
        <mat-option value="pending">Pending</mat-option>
        <mat-option value="completed">Completed</mat-option>
        <mat-option value="overdue">Overdue</mat-option>
      </mat-select>
    </mat-form-field>
    <button mat-raised-button color="primary" routerLink="/tasks/create"><mat-icon>add</mat-icon> Create Task</button>
    <button mat-raised-button color="secondary" (click)="downloadCSV()"><mat-icon>file_download</mat-icon> CSV</button>
    <button mat-raised-button color="secondary" (click)="downloadExcel()"><mat-icon>file_download</mat-icon> Excel</button>
  </div>
  <table mat-table [dataSource]="filteredTasks" class="mat-elevation-z8">
    <ng-container matColumnDef="title"><th mat-header-cell *matHeaderCellDef> Title </th><td mat-cell *matCellDef="let task"> {{task.title}} </td></ng-container>
    <ng-container matColumnDef="status"><th mat-header-cell *matHeaderCellDef> Status </th><td mat-cell *matCellDef="let task"> <span [class]="'status-badge ' + task.status">{{task.status}}</span> </td></ng-container>
    <ng-container matColumnDef="priority"><th mat-header-cell *matHeaderCellDef> Priority </th><td mat-cell *matCellDef="let task"> {{task.priority}} </td></ng-container>
    <ng-container matColumnDef="dueDate"><th mat-header-cell *matHeaderCellDef> Due Date </th><td mat-cell *matCellDef="let task"> {{task.dueDate | date}} </td></ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Actions </th>
      <td mat-cell *matCellDef="let task">
        <button mat-icon-button color="accent" (click)="assignTask(task)" title="Assign Task"><mat-icon>assignment_ind</mat-icon></button>
        <button mat-icon-button color="primary" [routerLink]="['/tasks/update', task.id]"><mat-icon>edit</mat-icon></button>
        <button mat-icon-button color="warn" (click)="deleteTask(task.id)"><mat-icon>delete</mat-icon></button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
