<div class="dashboard-container">
  <h2>Dashboard</h2>
  <div class="stats-cards">
    <mat-card class="stat-card pending">
      <mat-card-header><mat-card-subtitle>Pending Tasks</mat-card-subtitle><mat-card-title>{{ pendingTasks }}</mat-card-title></mat-card-header>
    </mat-card>
    <mat-card class="stat-card completed">
      <mat-card-header><mat-card-subtitle>Completed Tasks</mat-card-subtitle><mat-card-title>{{ completedTasks }}</mat-card-title></mat-card-header>
    </mat-card>
    <mat-card class="stat-card overdue">
      <mat-card-header><mat-card-subtitle>Overdue Tasks</mat-card-subtitle><mat-card-title>{{ overdueTasks }}</mat-card-title></mat-card-header>
    </mat-card>
  </div>
  <div class="charts-container">
    <mat-card class="chart-card">
      <mat-card-header><mat-card-title>Task Status Distribution</mat-card-title></mat-card-header>
      <mat-card-content><canvas baseChart [data]="pieChartData" [options]="pieChartOptions" [type]="pieChartType"></canvas></mat-card-content>
    </mat-card>
    <mat-card class="chart-card">
      <mat-card-header><mat-card-title>Monthly Task Completion</mat-card-title></mat-card-header>
      <mat-card-content><canvas baseChart [data]="barChartData" [options]="barChartOptions" [type]="barChartType"></canvas></mat-card-content>
    </mat-card>
  </div>
</div>
