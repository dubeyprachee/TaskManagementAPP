<form [formGroup]="taskForm" (ngSubmit)="onSubmit()">
  <mat-form-field appearance="fill"><mat-label>Title</mat-label><input matInput formControlName="title"></mat-form-field>
  <mat-form-field appearance="fill"><mat-label>Description</mat-label><textarea matInput formControlName="description"></textarea></mat-form-field>
  <mat-form-field appearance="fill"><mat-label>Due Date</mat-label><input matInput type="date" formControlName="dueDate"></mat-form-field>
  <mat-form-field appearance="fill">
    <mat-label>Status</mat-label>
    <mat-select formControlName="status">
      <mat-option value="pending">Pending</mat-option>
      <mat-option value="completed">Completed</mat-option>
      <mat-option value="overdue">Overdue</mat-option>
    </mat-select>
  </mat-form-field>
  <mat-form-field appearance="fill">
    <mat-label>Priority</mat-label>
    <mat-select formControlName="priority">
      <mat-option value="low">Low</mat-option>
      <mat-option value="medium">Medium</mat-option>
      <mat-option value="high">High</mat-option>
    </mat-select>
  </mat-form-field>

  <div class="actions">
    <button mat-button type="button" (click)="onCancel()">Cancel</button>
    <button mat-raised-button color="primary" type="submit" [disabled]="taskForm.invalid">{{ submitLabel }}</button>
  </div>
</form>
