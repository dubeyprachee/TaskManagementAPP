<form [formGroup]="userForm" (ngSubmit)="onSubmit()">
  <mat-form-field appearance="fill">
    <mat-label>Username</mat-label>
    <input matInput formControlName="userName" placeholder="Username">
    <mat-error *ngIf="userForm.get('userName')?.hasError('required')">Username is required</mat-error>
  </mat-form-field>
  <mat-form-field appearance="fill">
    <mat-label>Password</mat-label>
    <input matInput formControlName="password" placeholder="password">
    <mat-error *ngIf="userForm.get('password')?.hasError('required')">Password is required</mat-error>
  </mat-form-field>


    <mat-form-field appearance="fill">
      <mat-label>Role</mat-label>
      <mat-select formControlName="role">
        <mat-option value="ROLE_ADMIN">ADMIN</mat-option>
        <mat-option value="ROLE_USER">USER</mat-option>
      </mat-select>
    </mat-form-field>


  <div class="actions">
    <button mat-button type="button" (click)="onCancel()">Cancel</button>
    <button mat-raised-button color="primary" type="submit" [disabled]="!userForm.valid">{{submitLabel}}</button>
  </div>
</form>
